---
- name: Instalar Wazuh en Ubuntu
  hosts: wazuh-servers
  become: true
  gather_facts: true

  vars:
    # Rutas calculadas a partir de las variables del inventario.
    wazuh_stack_dir: "{{ wazuh_install_dir }}/single-node"
    wazuh_state_file: "{{ wazuh_install_dir }}/.awx-initialized"

    # Contraseñas inyectadas por la credencial de AWX.
    wazuh_admin_password: >-
      {{ lookup('ansible.builtin.env', 'WAZUH_ADMIN_PASSWORD') }}

    wazuh_api_password: >-
      {{ lookup('ansible.builtin.env', 'WAZUH_API_PASSWORD') }}

    # Detecta cambios de contraseña entre ejecuciones.
    wazuh_credentials_fingerprint: >-
      {{
        [wazuh_admin_password, wazuh_api_password]
        | to_json
        | hash('sha256')
      }}

  pre_tasks:
    - name: Comprobar las variables necesarias
      ansible.builtin.assert:
        that:
          - wazuh_install_dir is defined
          - wazuh_dashboard_port is defined
          - wazuh_project_name is defined
          - wazuh_version is defined
        fail_msg: >-
          Faltan variables de Wazuh.
          Configúralas en el grupo wazuh-servers de AWX.

    - name: Comprobar sistema operativo
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: Este playbook está preparado para Ubuntu.

    - name: Validar directorio de instalación
      ansible.builtin.assert:
        that:
          - wazuh_install_dir is match('^/')
          - wazuh_install_dir != '/'
        fail_msg: Indica una ruta absoluta válida para instalar Wazuh.

    - name: Validar los requisitos de las contraseñas
      ansible.builtin.assert:
        that:
          - wazuh_admin_password | length >= 8
          - wazuh_api_password | length >= 8
          - wazuh_api_password | length <= 64
          - wazuh_api_password is search('[A-Z]')
          - wazuh_api_password is search('[a-z]')
          - wazuh_api_password is search('[0-9]')
          - wazuh_api_password is search('[^a-zA-Z0-9\s]')
        fail_msg: >-
          Revisa las contraseñas de la credencial de Wazuh.
          La API requiere entre 8 y 64 caracteres, mayúscula,
          minúscula, número y símbolo.
      no_log: true

    - name: Validar el puerto del Dashboard
      ansible.builtin.assert:
        that:
          - (wazuh_dashboard_port | string) is match('^[0-9]+$')
          - wazuh_dashboard_port | int >= 1
          - wazuh_dashboard_port | int <= 65535
        fail_msg: El puerto debe estar entre 1 y 65535.

    - name: Comprobar que Docker funciona
      ansible.builtin.command:
        argv:
          - docker
          - info
      changed_when: false

    - name: Comprobar Docker Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: wazuh_compose_version
      changed_when: false

    - name: Comprobar la versión mínima de Compose
      ansible.builtin.assert:
        that:
          - >-
            (wazuh_compose_version.stdout | trim
            | regex_replace('^v', ''))
            is version('2.18.0', '>=')
        fail_msg: Se necesita Docker Compose 2.18.0 o posterior.

    - name: Comprobar si AWX ya preparó esta instalación
      ansible.builtin.stat:
        path: "{{ wazuh_state_file }}"
      register: wazuh_state

    - name: Leer la huella de las credenciales anteriores
      ansible.builtin.slurp:
        src: "{{ wazuh_state_file }}"
      register: wazuh_saved_credentials
      when: wazuh_state.stat.exists
      no_log: true

    - name: Evitar cambiar contraseñas mediante el instalador
      ansible.builtin.assert:
        that:
          - >-
            (wazuh_saved_credentials.content | b64decode | trim)
            == wazuh_credentials_fingerprint
        fail_msg: >-
          Las credenciales no coinciden con las de la instalación.
          Utiliza un procedimiento de rotación de contraseñas.
      when: wazuh_state.stat.exists
      no_log: true

    - name: Buscar volúmenes de una instalación anterior
      ansible.builtin.command:
        argv:
          - docker
          - volume
          - ls
          - --quiet
          - --filter
          - "label=com.docker.compose.project={{ wazuh_project_name }}"
      register: wazuh_existing_volumes
      changed_when: false
      when: not wazuh_state.stat.exists

    - name: Evitar reutilizar una instalación no gestionada por este playbook
      ansible.builtin.assert:
        that:
          - wazuh_existing_volumes.stdout | trim == ''
        fail_msg: >-
          Existen volúmenes de este proyecto Docker.
          La instalación anterior necesita una migración.
          No se ha eliminado ningún volumen.
      when: not wazuh_state.stat.exists

  tasks:
    - name: Instalar Git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configurar vm.max_map_count para el Indexer
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        sysctl_set: true
        reload: true
        sysctl_file: /etc/sysctl.d/99-wazuh.conf

    - name: Crear el directorio de instalación
      ansible.builtin.file:
        path: "{{ wazuh_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Descargar el repositorio oficial de Wazuh
      ansible.builtin.git:
        repo: https://github.com/wazuh/wazuh-docker.git
        dest: "{{ wazuh_install_dir }}"
        version: "v{{ wazuh_version }}"
        depth: 1
        update: false
        force: false

    - name: Verificar la versión del repositorio descargado
      ansible.builtin.command:
        argv:
          - git
          - describe
          - --tags
          - --exact-match
        chdir: "{{ wazuh_install_dir }}"
      register: wazuh_git_version
      changed_when: false
      failed_when: >-
        wazuh_git_version.rc != 0 or
        (wazuh_git_version.stdout | trim) != ('v' ~ wazuh_version)

    - name: Leer el archivo Docker Compose
      ansible.builtin.slurp:
        src: "{{ wazuh_stack_dir }}/docker-compose.yml"
      register: wazuh_compose_raw
      no_log: true

    - name: Interpretar la configuración de Docker Compose
      ansible.builtin.set_fact:
        wazuh_compose: >-
          {{ wazuh_compose_raw.content | b64decode | from_yaml }}
      no_log: true

    - name: Configurar el puerto externo del Dashboard
      ansible.builtin.copy:
        dest: "{{ wazuh_stack_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"
        content: >-
          {{
            wazuh_compose
            | combine(
                {
                  'services': {
                    'wazuh.dashboard': {
                      'ports': [
                        (wazuh_dashboard_port | string) ~ ':5601'
                      ]
                    }
                  }
                },
                recursive=true
              )
            | to_nice_yaml(indent=2, width=4096)
          }}
      no_log: true
      diff: false

    - name: Crear el archivo de credenciales de Compose
      ansible.builtin.template:
        src: ../templates/wazuh/compose.credentials.yml.j2
        dest: "{{ wazuh_stack_dir }}/compose.credentials.yml"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Preparar las credenciales antes del primer arranque
      when: not wazuh_state.stat.exists
      block:
        - name: Generar el hash de ADMIN en un contenedor temporal
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --entrypoint
              - bash
              - -e
              - JAVA_HOME=/usr/share/wazuh-indexer/jdk
              - "wazuh/wazuh-indexer:{{ wazuh_version }}"
              - /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
              - -p
              - "{{ wazuh_admin_password }}"
          register: wazuh_hash_result
          changed_when: true
          no_log: true

        - name: Obtener el hash generado
          ansible.builtin.set_fact:
            wazuh_admin_hash: >-
              {{ wazuh_hash_result.stdout_lines | last | trim }}
          no_log: true

        - name: Validar el formato del hash
          ansible.builtin.assert:
            that:
              - wazuh_admin_hash is match('^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$')
          no_log: true

        - name: Aplicar el hash únicamente a ADMIN
          ansible.builtin.replace:
            path: "{{ wazuh_stack_dir }}/config/wazuh_indexer/internal_users.yml"
            regexp: '(?m)(^admin:\s*\n[ \t]+hash:)[^\n]*'
            replace: '\g<1> "{{ wazuh_admin_hash }}"'
          no_log: true
          diff: false

        - name: Leer los usuarios para verificar el cambio
          ansible.builtin.slurp:
            src: "{{ wazuh_stack_dir }}/config/wazuh_indexer/internal_users.yml"
          register: wazuh_users_check
          no_log: true

        - name: Confirmar que ADMIN tiene el hash correcto
          ansible.builtin.assert:
            that:
              - >-
                (wazuh_users_check.content | b64decode | from_yaml)
                ['admin']['hash'] == wazuh_admin_hash
          no_log: true

        - name: Configurar la conexión del Dashboard con la API
          ansible.builtin.copy:
            dest: "{{ wazuh_stack_dir }}/config/wazuh_dashboard/wazuh.yml"
            owner: root
            group: root
            mode: "0644"
            content: |
              hosts:
                - 1513629884013:
                    url: "https://wazuh.manager"
                    port: 55000
                    username: wazuh-wui
                    password: {{ wazuh_api_password | to_json }}
                    run_as: true
          no_log: true
          diff: false

    - name: Generar los certificados iniciales
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ wazuh_project_name }}"
          - -f
          - generate-indexer-certs.yml
          - run
          - --rm
          - generator
        chdir: "{{ wazuh_stack_dir }}"
        creates: "{{ wazuh_install_dir }}/.awx-certificates-ready"

    - name: Registrar que el generador de certificados terminó correctamente
      ansible.builtin.copy:
        dest: "{{ wazuh_install_dir }}/.awx-certificates-ready"
        content: "Certificados generados\n"
        owner: root
        group: root
        mode: "0600"

    - name: Validar la configuración de Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ wazuh_project_name }}"
          - -f
          - docker-compose.yml
          - -f
          - compose.credentials.yml
          - config
          - --quiet
        chdir: "{{ wazuh_stack_dir }}"
      changed_when: false
      no_log: true

    - name: Registrar la preparación antes de crear los volúmenes
      ansible.builtin.copy:
        dest: "{{ wazuh_state_file }}"
        content: "{{ wazuh_credentials_fingerprint }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Arrancar los servicios de Wazuh
      community.docker.docker_compose_v2:
        project_src: "{{ wazuh_stack_dir }}"
        project_name: "{{ wazuh_project_name }}"
        files:
          - docker-compose.yml
          - compose.credentials.yml
        state: present
        pull: missing
        recreate: auto
      no_log: true

    - name: Esperar a que el Dashboard responda
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ wazuh_dashboard_port }}/"
        validate_certs: false
        follow_redirects: none
        status_code:
          - 200
          - 302
      register: wazuh_dashboard_check
      until: (wazuh_dashboard_check.status | default(0)) in [200, 302]
      retries: 60
      delay: 10

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: El Dashboard de Wazuh responde correctamente.