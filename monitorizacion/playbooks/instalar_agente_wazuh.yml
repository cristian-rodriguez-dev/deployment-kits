---
- name: Configurar agente Wazuh
  hosts: wazuh-agents
  become: true
  gather_facts: false

  vars:
    wazuh_manager_ip: "{{ wazuh_server_ip }}"

  tasks:
    - name: Comprobar que existe ossec.conf
      ansible.builtin.stat:
        path: /var/ossec/etc/ossec.conf
      register: wazuh_ossec_conf

    - name: Detener si no existe ossec.conf
      ansible.builtin.assert:
        that:
          - wazuh_ossec_conf.stat.exists
        fail_msg: "No existe /var/ossec/etc/ossec.conf. ¿Está instalado wazuh-agent?"

    - name: Crear copia de seguridad de ossec.conf
      ansible.builtin.copy:
        src: /var/ossec/etc/ossec.conf
        dest: /var/ossec/etc/ossec.conf.bak
        remote_src: true
        owner: root
        group: root
        mode: "0640"
        force: false

    - name: Configurar address del manager
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '(<address>)[^<]*(</address>)'
        replace: '\g<1>{{ wazuh_manager_ip }}\g<2>'
      notify: Reiniciar agente Wazuh

    - name: Configurar manager_address si existe
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '(<manager_address>)[^<]*(</manager_address>)'
        replace: '\g<1>{{ wazuh_manager_ip }}\g<2>'
      notify: Reiniciar agente Wazuh

    - name: Aplicar cambios pendientes
      ansible.builtin.meta: flush_handlers

    - name: Comprobar estado del agente
      ansible.builtin.systemd:
        name: wazuh-agent
        state: started
        enabled: true

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg: "Agente Wazuh configurado contra {{ wazuh_manager_ip }}."

  handlers:
    - name: Reiniciar agente Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
        enabled: true