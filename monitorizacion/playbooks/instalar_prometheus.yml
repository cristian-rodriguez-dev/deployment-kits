---
- name: Instalar Prometheus y Node Exporter
  hosts: prometheus-servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Comprobar las variables necesarias
      ansible.builtin.assert:
        that:
          - var_prometheus_install_dir is defined
          - var_prometheus_access_group is defined
          - var_prometheus_project_name is defined
          - var_monitorizacion_network is defined
          - var_prometheus_image is defined
          - var_node_exporter_image is defined
          - var_prometheus_port is defined
          - var_node_exporter_port is defined
          - var_prometheus_retention is defined
          - var_prometheus_scrape_interval is defined
          - var_prometheus_local_name is defined
          - var_prometheus_departamentos is defined
        fail_msg: >-
          Faltan variables de Prometheus.
          Configúralas en el grupo prometheus-servers de AWX.

    - name: Comprobar sistema operativo
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: Este playbook está preparado para Ubuntu.

    - name: Validar directorio de instalación
      ansible.builtin.assert:
        that:
          - var_prometheus_install_dir is match('^/')
          - var_prometheus_install_dir != '/'
        fail_msg: Indica una ruta absoluta válida para instalar Prometheus.

    - name: Comprobar que existe el grupo de acceso
      ansible.builtin.getent:
        database: group
        key: "{{ var_prometheus_access_group }}"

    - name: Validar puertos
      ansible.builtin.assert:
        that:
          - (var_prometheus_port | string) is match('^[0-9]+$')
          - (var_node_exporter_port | string) is match('^[0-9]+$')
          - var_prometheus_port | int >= 1
          - var_prometheus_port | int <= 65535
          - var_node_exporter_port | int >= 1
          - var_node_exporter_port | int <= 65535
          - (var_prometheus_port | int) != (var_node_exporter_port | int)
        fail_msg: Los puertos deben ser válidos y diferentes.

    - name: Comprobar que Docker funciona
      ansible.builtin.command:
        argv:
          - docker
          - info
      changed_when: false

    - name: Comprobar Docker Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: var_prometheus_compose_version
      changed_when: false

    - name: Comprobar versión mínima de Compose
      ansible.builtin.assert:
        that:
          - >-
            (var_prometheus_compose_version.stdout | trim
            | regex_replace('^v', ''))
            is version('2.18.0', '>=')
        fail_msg: Se necesita Docker Compose 2.18.0 o posterior.

  tasks:
    - name: Instalar dependencia de los módulos Docker
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Crear el directorio de instalación con acceso para tu grupo
      ansible.builtin.file:
        path: "{{ var_prometheus_install_dir }}"
        state: directory
        owner: root
        group: "{{ var_prometheus_access_group }}"
        mode: "0750"

    - name: Crear el directorio de configuración
      ansible.builtin.file:
        path: "{{ var_prometheus_install_dir }}/prometheus"
        state: directory
        owner: root
        group: "{{ var_prometheus_access_group }}"
        mode: "0755"

    - name: Crear directorio persistente para las métricas
      ansible.builtin.file:
        path: "{{ var_prometheus_install_dir }}/data"
        state: directory
        owner: "65534"
        group: "65534"
        mode: "0750"

    - name: Crear la red compartida con Grafana
      community.docker.docker_network:
        name: "{{ var_monitorizacion_network }}"
        state: present

    - name: Descargar las imágenes si no existen
      community.docker.docker_image:
        name: "{{ var_prometheus_container_image }}"
        source: pull
        state: present
      loop:
        - "{{ var_prometheus_image }}"
        - "{{ var_node_exporter_image }}"
      loop_control:
        loop_var: var_prometheus_container_image

    - name: Generar y validar la configuración de Prometheus
      ansible.builtin.template:
        src: ../templates/prometheus/prometheus.yml.j2
        dest: "{{ var_prometheus_install_dir }}/prometheus/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: >-
          docker run --rm
          --network none
          --user 0:0
          --entrypoint /bin/promtool
          --volume %s:/tmp/prometheus.yml:ro
          --volume {{ var_prometheus_kubernetes_credentials_dir }}:/etc/prometheus-kubernetes:ro
          {{ var_prometheus_image }}
          check config /tmp/prometheus.yml
      notify: Recargar configuración de Prometheus

    - name: Generar y validar Docker Compose
      ansible.builtin.template:
        src: ../templates/prometheus/docker-compose.yml.j2
        dest: "{{ var_prometheus_install_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: >-
          docker compose
          --project-name {{ var_prometheus_project_name }}
          -f %s config --quiet

    - name: Arrancar los servicios conservando los datos
      community.docker.docker_compose_v2:
        project_src: "{{ var_prometheus_install_dir }}"
        project_name: "{{ var_prometheus_project_name }}"
        state: present
        pull: missing
        recreate: auto

    - name: Esperar a que Prometheus esté preparado
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ var_prometheus_port }}/-/ready"
        status_code: 200
      register: var_prometheus_ready
      until: (var_prometheus_ready.status | default(0)) == 200
      retries: 30
      delay: 5

    - name: Aplicar los cambios pendientes de configuración
      ansible.builtin.meta: flush_handlers

    - name: Comprobar que Node Exporter responde
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ var_node_exporter_port }}/metrics"
        status_code: 200
      register: var_node_exporter_ready
      until: (var_node_exporter_ready.status | default(0)) == 200
      retries: 12
      delay: 5

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg:
          - "Prometheus y Node Exporter responden correctamente."
          - "Directorio: {{ var_prometheus_install_dir }}"

  handlers:
    - name: Recargar configuración de Prometheus
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ var_prometheus_project_name }}"
          - kill
          - --signal
          - SIGHUP
          - prometheus
        chdir: "{{ var_prometheus_install_dir }}"
      changed_when: true