---
- name: Instalar Grafana limpio o inspeccionar una instalacion existente
  hosts: grafana-servers
  become: true
  gather_facts: true

  vars:
    var_grafana_admin_password: >-
      {{ lookup('ansible.builtin.env', 'VAR_GRAFANA_ADMIN_PASSWORD') }}

    var_grafana_state_file: "{{ var_grafana_install_dir }}/.awx-initialized"

    var_grafana_credentials_fingerprint: >-
      {{
        [
          var_grafana_admin_user,
          var_grafana_admin_email,
          var_grafana_admin_password
        ]
        | to_json
        | hash('sha256')
      }}

  pre_tasks:
    # Contrato Job 05: INSPECT por defecto; INSTALL exige opt-in explicito.
    # Ninguna tarea de escritura puede preceder al guard de instalacion.
    - name: Validar modo seguro del Job 05 y ruta objetivo
      ansible.builtin.assert:
        that:
          - (var_grafana_job05_mode | default('inspect')) in ['inspect', 'install']
          - var_grafana_install_dir is defined
          - (var_grafana_install_dir | default('')) is string
          - (var_grafana_install_dir | default('')) is match('^/.+')
          - (var_grafana_install_dir | default('')) != '/'
          - "'/../' not in (var_grafana_install_dir | default(''))"
          - "not (var_grafana_install_dir | default('')).endswith('/..')"
        fail_msg: >-
          Job 05: usa inspect o install y una ruta absoluta no raiz
          sin recorridos al directorio padre.

    - name: Detectar directorio objetivo de Grafana
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}"
        follow: false
      register: var_grafana_existing_dir

    - name: Detectar Compose ya existente
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/docker-compose.yml"
        follow: false
      register: var_grafana_existing_compose

    - name: Detectar almacenamiento de Grafana
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/data"
        follow: false
      register: var_grafana_existing_data

    - name: Detectar base de datos existente
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/data/grafana.db"
        follow: false
      register: var_grafana_existing_database

    - name: Detectar provisioning existente
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/provisioning"
        follow: false
      register: var_grafana_existing_provisioning

    - name: Detectar secretos existentes de Grafana
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/secrets"
        follow: false
      register: var_grafana_existing_secrets

    - name: Detectar estado previo de AWX
      ansible.builtin.stat:
        path: "{{ var_grafana_state_file }}"
        follow: false
      register: var_grafana_existing_state

    - name: Detectar archivo de variables privado
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/.env"
        follow: false
      register: var_grafana_existing_env

    - name: Inspeccionar presencia declarada de SMTP sin exponer configuracion
      ansible.builtin.slurp:
        src: "{{ var_grafana_install_dir }}/docker-compose.yml"
      register: var_grafana_existing_compose_bytes
      when:
        - (var_grafana_job05_mode | default('inspect')) == 'inspect'
        - var_grafana_existing_compose.stat.isreg | default(false)
      no_log: true

    - name: Informar del estado protegido sin modificaciones
      ansible.builtin.debug:
        msg:
          - "Modo: INSPECT; solo lectura; no se instalara ni reiniciara Grafana"
          - "Directorio existente: {{ var_grafana_existing_dir.stat.exists }}"
          - "Compose existente: {{ var_grafana_existing_compose.stat.exists }}"
          - "Almacenamiento existente: {{ var_grafana_existing_data.stat.exists }}"
          - "Base de datos existente: {{ var_grafana_existing_database.stat.exists }}"
          - "Provisioning existente: {{ var_grafana_existing_provisioning.stat.exists }}"
          - "Secretos existentes: {{ var_grafana_existing_secrets.stat.exists }}"
          - "Marca AWX existente: {{ var_grafana_existing_state.stat.exists }}"
          - "Archivo .env existente: {{ var_grafana_existing_env.stat.exists }}"
          - >-
            SMTP declarado en Compose:
            {{ 'GF_SMTP_ENABLED' in
               (var_grafana_existing_compose_bytes.content | default('') | b64decode) }}
          - "Sin alteraciones de volumenes, alertas, secretos ni contenedores"
      when: (var_grafana_job05_mode | default('inspect')) == 'inspect'

    - name: Terminar inspeccion sin ejecutar tareas de despliegue
      ansible.builtin.meta: end_play
      when: (var_grafana_job05_mode | default('inspect')) == 'inspect'

    - name: Exigir confirmacion explicita para instalar Grafana nuevo
      ansible.builtin.assert:
        that:
          - (var_grafana_job05_confirm | default('')) == 'INSTALL_NEW_GRAFANA'
        fail_msg: >-
          Instalacion no autorizada. Para una VM nueva indica
          var_grafana_job05_mode: install y
          var_grafana_job05_confirm: INSTALL_NEW_GRAFANA.
      when: (var_grafana_job05_mode | default('inspect')) == 'install'

    - name: Validar tipo de flag SMTP para la instalacion nueva
      ansible.builtin.assert:
        that:
          - (var_grafana_smtp_enabled | default(false)) is boolean
        fail_msg: var_grafana_smtp_enabled debe ser booleano (true/false).
      when: (var_grafana_job05_mode | default('inspect')) == 'install'

    # Se permite solo una carpeta nueva inexistente o una carpeta cuyo
    # unico elemento es .env, preprovisionado para SMTP. Nada mas.
    - name: Inventariar contenido previo del directorio objetivo
      ansible.builtin.find:
        paths: "{{ var_grafana_install_dir }}"
        recurse: false
        hidden: true
        file_type: any
      register: var_grafana_existing_entries
      changed_when: false
      when:
        - (var_grafana_job05_mode | default('inspect')) == 'install'
        - var_grafana_existing_dir.stat.isdir | default(false)
        - not (var_grafana_existing_dir.stat.islnk | default(false))

    - name: Bloquear sobreescritura de instalaciones operativas
      ansible.builtin.assert:
        that:
          - >-
            not var_grafana_existing_dir.stat.exists
            or (
              (var_grafana_existing_dir.stat.isdir | default(false))
              and not (var_grafana_existing_dir.stat.islnk | default(false))
              and (
                var_grafana_existing_entries.files | default([])
                | map(attribute='path') | map('basename') | list | sort
              ) == (
                ['.env'] if (var_grafana_smtp_enabled | default(false) | bool) else []
              )
            )
          - not var_grafana_existing_compose.stat.exists
          - not var_grafana_existing_data.stat.exists
          - not var_grafana_existing_database.stat.exists
          - not var_grafana_existing_provisioning.stat.exists
          - not var_grafana_existing_secrets.stat.exists
          - not var_grafana_existing_state.stat.exists
        fail_msg: >-
          Job 05 INSTALL bloqueado: la ruta contiene una instalacion o
          ficheros anteriores. Solo se acepta un directorio nuevo vacio,
          o un directorio que contenga exclusivamente el .env privado de SMTP.
          No se modificara Grafana; utiliza inspect o una adopcion separada.
      when: (var_grafana_job05_mode | default('inspect')) == 'install'

    - name: Comprobar que AWX proporciona las variables de instalacion
      ansible.builtin.assert:
        that:
          - var_grafana_access_group is defined
          - var_grafana_project_name is defined
          - (var_grafana_project_name | default('') | string | length) > 0
          - var_grafana_image is defined
          - var_grafana_port is defined
          - var_grafana_admin_user is defined
          - var_grafana_admin_email is defined
          - var_monitorizacion_network is defined
          - var_grafana_prometheus_url is defined
        fail_msg: >-
          Faltan variables de instalacion de Grafana.
          Configuralas en el inventario AWX (grupo grafana-servers).
      when: (var_grafana_job05_mode | default('inspect')) == 'install'

    - name: Exigir .env protegido para instalacion limpia con SMTP
      ansible.builtin.assert:
        that:
          - var_grafana_existing_env.stat.exists
          - var_grafana_existing_env.stat.isreg | default(false)
          - not (var_grafana_existing_env.stat.islnk | default(false))
          - (var_grafana_existing_env.stat.uid | default(-1)) == 0
          - (var_grafana_existing_env.stat.mode | default('')) == '0600'
        fail_msg: >-
          Para SMTP crea previamente un .env root:root 0600 (archivo regular,
          no enlace simbolico) con GRAFANA_SMTP_HOST, GRAFANA_SMTP_USER,
          GRAFANA_SMTP_PASSWORD y GRAFANA_SMTP_FROM_ADDRESS.
      when: var_grafana_smtp_enabled | default(false) | bool

    - name: Comprobar claves SMTP sin revelar sus valores
      ansible.builtin.slurp:
        src: "{{ var_grafana_install_dir }}/.env"
      register: var_grafana_smtp_env_bytes
      when: var_grafana_smtp_enabled | default(false) | bool
      no_log: true

    - name: Rechazar credenciales SMTP ausentes o vacias
      ansible.builtin.assert:
        that:
          - >-
            ((var_grafana_smtp_env_bytes.content | b64decode)
            | regex_search('(?m)^GRAFANA_SMTP_HOST=[^\r\n]+$')) is not none
          - >-
            ((var_grafana_smtp_env_bytes.content | b64decode)
            | regex_search('(?m)^GRAFANA_SMTP_USER=[^\r\n]+$')) is not none
          - >-
            ((var_grafana_smtp_env_bytes.content | b64decode)
            | regex_search('(?m)^GRAFANA_SMTP_PASSWORD=[^\r\n]+$')) is not none
          - >-
            ((var_grafana_smtp_env_bytes.content | b64decode)
            | regex_search('(?m)^GRAFANA_SMTP_FROM_ADDRESS=[^\r\n]+$')) is not none
        fail_msg: "Faltan claves SMTP o estan vacias en el .env privado."
      when: var_grafana_smtp_enabled | default(false) | bool
      no_log: true

    - name: Comprobar sistema operativo
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: Este playbook está preparado para Ubuntu.

    - name: Validar el directorio de instalación
      ansible.builtin.assert:
        that:
          - var_grafana_install_dir is match('^/')
          - var_grafana_install_dir != '/'
        fail_msg: Indica una ruta absoluta válida para instalar Grafana.

    - name: Comprobar que existe el grupo de acceso
      ansible.builtin.getent:
        database: group
        key: "{{ var_grafana_access_group }}"

    - name: Validar credenciales iniciales
      ansible.builtin.assert:
        that:
          - var_grafana_admin_user | length > 0
          - var_grafana_admin_email | length > 0
          - var_grafana_admin_password | length >= 8
          - var_grafana_admin_password == (var_grafana_admin_password | trim)
          - "'\n' not in var_grafana_admin_password"
          - "'\r' not in var_grafana_admin_password"
        fail_msg: >-
          Revisa el usuario, correo y la credencial de Grafana.
          La contraseña debe tener al menos 8 caracteres,
          sin saltos de línea ni espacios en los extremos.
      no_log: true

    - name: Validar puerto web
      ansible.builtin.assert:
        that:
          - (var_grafana_port | string) is match('^[0-9]+$')
          - var_grafana_port | int >= 1
          - var_grafana_port | int <= 65535
        fail_msg: El puerto debe estar entre 1 y 65535.

    - name: Comprobar Docker
      ansible.builtin.command:
        argv:
          - docker
          - info
      changed_when: false

    - name: Detectar contenedores del proyecto Compose de Grafana
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - -aq
          - --filter
          - "label=com.docker.compose.project={{ var_grafana_project_name }}"
      register: var_grafana_existing_project_containers
      changed_when: false

    - name: Bloquear un proyecto Compose de Grafana preexistente
      ansible.builtin.assert:
        that:
          - (var_grafana_existing_project_containers.stdout | trim) == ''
        fail_msg: >-
          Ya existen contenedores (incluso detenidos) del proyecto Compose
          indicado. No se duplicara ni se recreara Grafana con este Job 05.

    - name: Comprobar Docker Compose
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - version
          - --short
      register: var_grafana_compose_version
      changed_when: false

    - name: Comprobar versión mínima de Compose
      ansible.builtin.assert:
        that:
          - >-
            (var_grafana_compose_version.stdout | trim
            | regex_replace('^v', ''))
            is version('2.18.0', '>=')
        fail_msg: Se necesita Docker Compose 2.18.0 o posterior.

    - name: Comprobar si AWX ya preparó esta instalación
      ansible.builtin.stat:
        path: "{{ var_grafana_state_file }}"
      register: var_grafana_state

    - name: Comprobar si hay una base de datos anterior
      ansible.builtin.stat:
        path: "{{ var_grafana_install_dir }}/data/grafana.db"
      register: var_grafana_database

    - name: Evitar adoptar automáticamente una instalación anterior
      ansible.builtin.assert:
        that:
          - >-
            var_grafana_state.stat.exists
            or not var_grafana_database.stat.exists
        fail_msg: >-
          Existe una base de datos que no fue preparada por este playbook.
          Revisa su migración antes de continuar.

    - name: Leer huella de las credenciales iniciales
      ansible.builtin.slurp:
        src: "{{ var_grafana_state_file }}"
      register: var_grafana_saved_credentials
      when: var_grafana_state.stat.exists
      no_log: true

    - name: Evitar cambios accidentales de las credenciales iniciales
      ansible.builtin.assert:
        that:
          - >-
            (var_grafana_saved_credentials.content | b64decode | trim)
            == var_grafana_credentials_fingerprint
        fail_msg: >-
          Han cambiado los datos iniciales del administrador.
          Este instalador no realiza rotaciones de contraseña.
      when: var_grafana_state.stat.exists
      no_log: true

  tasks:
    - name: Instalar dependencia de los módulos Docker
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Crear el directorio de instalación con acceso para tu grupo
      ansible.builtin.file:
        path: "{{ var_grafana_install_dir }}"
        state: directory
        owner: root
        group: "{{ var_grafana_access_group }}"
        mode: "0750"

    - name: Crear directorios de configuración
      ansible.builtin.file:
        path: "{{ var_grafana_config_dir }}"
        state: directory
        owner: root
        group: "{{ var_grafana_access_group }}"
        mode: "0755"
      loop:
        - "{{ var_grafana_install_dir }}/provisioning"
        - "{{ var_grafana_install_dir }}/provisioning/datasources"
      loop_control:
        loop_var: var_grafana_config_dir

    - name: Crear directorio privado de secretos
      ansible.builtin.file:
        path: "{{ var_grafana_install_dir }}/secrets"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Crear directorio persistente de Grafana
      ansible.builtin.file:
        path: "{{ var_grafana_install_dir }}/data"
        state: directory
        owner: "472"
        group: "472"
        mode: "0750"

    - name: Crear la red compartida con Prometheus
      community.docker.docker_network:
        name: "{{ var_monitorizacion_network }}"
        state: present

    - name: Guardar la contraseña en un archivo protegido
      ansible.builtin.copy:
        dest: "{{ var_grafana_install_dir }}/secrets/admin_password"
        content: "{{ var_grafana_admin_password }}"
        owner: "472"
        group: "472"
        mode: "0400"
      no_log: true
      diff: false
      notify: Recrear Grafana para actualizar el montaje del secreto

    - name: Configurar Prometheus como fuente de datos
      ansible.builtin.template:
        src: ../templates/grafana/datasources.yml.j2
        dest: "{{ var_grafana_install_dir }}/provisioning/datasources/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Reiniciar Grafana para aplicar la fuente de datos

    - name: Generar y validar Docker Compose
      ansible.builtin.template:
        src: ../templates/grafana/docker-compose.yml.j2
        dest: "{{ var_grafana_install_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"
        backup: true
        validate: >-
          docker compose
          {% if var_grafana_smtp_enabled | default(false) | bool %}
          --env-file {{ var_grafana_install_dir }}/.env
          {% endif %}
          --project-name {{ var_grafana_project_name }}
          -f %s config --quiet
      no_log: true
      diff: false

    - name: Registrar las credenciales iniciales antes del arranque
      ansible.builtin.copy:
        dest: "{{ var_grafana_state_file }}"
        content: "{{ var_grafana_credentials_fingerprint }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      diff: false

    - name: Arrancar Grafana conservando sus datos
      community.docker.docker_compose_v2:
        project_src: "{{ var_grafana_install_dir }}"
        project_name: "{{ var_grafana_project_name }}"
        state: present
        pull: missing
        recreate: auto
      register: var_grafana_deployment
      no_log: true

    - name: Aplicar cambios pendientes
      ansible.builtin.meta: flush_handlers

    - name: Esperar a que Grafana y su base de datos respondan
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ var_grafana_port }}/api/health"
        status_code: 200
        return_content: true
      register: var_grafana_health
      until:
        - (var_grafana_health.status | default(0)) == 200
        - (var_grafana_health.json | default({})).get('database', '') == 'ok'
      retries: 30
      delay: 5

    - name: Comprobar la conexión de Grafana con Prometheus
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ var_grafana_port }}/api/datasources/uid/prometheus/health
        url_username: "{{ var_grafana_admin_user }}"
        url_password: "{{ var_grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      register: var_grafana_datasource_health
      until:
        - (var_grafana_datasource_health.status | default(0)) == 200
        - >-
          (var_grafana_datasource_health.json | default({})).get('status', '')
          == 'OK'
      retries: 30
      delay: 5
      no_log: true

    - name: Mostrar resultado
      ansible.builtin.debug:
        msg:
          - "Grafana está disponible y su conexión con Prometheus funciona."
          - "Directorio: {{ var_grafana_install_dir }}"

  handlers:
    - name: Recrear Grafana para actualizar el montaje del secreto
      community.docker.docker_compose_v2:
        project_src: "{{ var_grafana_install_dir }}"
        project_name: "{{ var_grafana_project_name }}"
        services:
          - grafana
        state: present
        recreate: always
      when: not var_grafana_deployment.changed
      register: var_grafana_secret_recreation
      no_log: true

    - name: Reiniciar Grafana para aplicar la fuente de datos
      community.docker.docker_compose_v2:
        project_src: "{{ var_grafana_install_dir }}"
        project_name: "{{ var_grafana_project_name }}"
        services:
          - grafana
        state: restarted
      when:
        - not var_grafana_deployment.changed
        - not (var_grafana_secret_recreation.changed | default(false))
      no_log: true