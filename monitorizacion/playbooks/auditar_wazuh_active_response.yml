---
- name: Auditar Wazuh Active Response en agentes sin cambios
  hosts: monitoring-agents
  become: true
  gather_facts: false
  tasks:
    - name: Auditar agentes
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../roles/wazuh_active_response_agent"
      vars:
        var_wazuh_ar_agent_mode: audit

- name: Auditar configuracion del Manager sin cambios
  hosts: wazuh-servers
  become: true
  gather_facts: false
  tasks:
    - name: Auditar Manager
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../roles/wazuh_active_response_manager"
      vars:
        var_wazuh_ar_manager_mode: audit
