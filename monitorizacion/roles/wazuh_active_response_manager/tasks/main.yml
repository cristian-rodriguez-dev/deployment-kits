---
- name: Comprobar modo del Manager
  ansible.builtin.assert:
    that:
      - var_wazuh_ar_manager_mode in ['audit', 'apply']

- name: Comprobar fichero de configuracion del host
  ansible.builtin.stat:
    path: "{{ var_wazuh_ar_manager_config_path }}"
  register: _wazuh_ar_manager_conf_stat

- name: Comprobar que se indico el fichero correcto
  ansible.builtin.assert:
    that:
      - _wazuh_ar_manager_conf_stat.stat.exists
      - _wazuh_ar_manager_conf_stat.stat.isreg
      - not (_wazuh_ar_manager_conf_stat.stat.islnk | default(false))
    fail_msg: >-
      Indica var_wazuh_ar_manager_config_path con el fichero real del HOST
      montado en Wazuh Docker, no con la ruta dentro del contenedor.

- name: Validar modo auditoria sin lectura de secretos en el log
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import pathlib,xml.etree.ElementTree as E;
        import sys;
        p=pathlib.Path(sys.argv[1]);
        s=p.read_text();
        E.fromstring('<root>'+s+'</root>');
        print('XML sintacticamente valido en host')
      - "{{ var_wazuh_ar_manager_config_path }}"
  changed_when: false
  no_log: true

- name: Revisar configuracion Wazuh sin imprimir su contenido
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import pathlib,re,sys;
        s=pathlib.Path(sys.argv[1]).read_text();
        print('comando_piloto=' + str('<name>ssh-block-pilot</name>' in s));
        print('respuesta_piloto=' + str(bool(re.search(r'<active-response>[\s\S]*?<command>ssh-block-pilot</command>',s))))
      - "{{ var_wazuh_ar_manager_config_path }}"
  register: _wazuh_ar_manager_audit
  changed_when: false
  no_log: true

- name: Resumen sin secretos Manager
  ansible.builtin.debug:
    msg:
      - "Manager: XML verificado, modo={{ var_wazuh_ar_manager_mode }}"
      - "{{ _wazuh_ar_manager_audit.stdout_lines }}"
      - "Sin cambios en el Manager ni en sus contenedores."

- name: Aplicar solo con autorizaciones explicitas
  ansible.builtin.include_tasks: apply.yml
  when: var_wazuh_ar_manager_mode == 'apply'
