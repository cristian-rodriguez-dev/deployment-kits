---
# Copiar y adaptar en las variables del grupo wazuh_servers de AWX.

# var_wazuh_install_dir: /ruta/absoluta/wazuh-docker
# var_wazuh_dashboard_port: 443
# var_wazuh_project_name: single-node
# wazuh_version: "4.14.8"

# Las contraseñas se proporcionan mediante la credencial de AWX:
# VAR_WAZUH_ADMIN_PASSWORD
# VAR_WAZUH_API_PASSWORD

# Este playbook no realiza actualizaciones de versión
# ni rotaciones de contraseña sobre instalaciones existentes.

# Apariencia y zona horaria del Dashboard:
# var_wazuh_dashboard_timezone: Europe/Madrid
# var_wazuh_dashboard_dark_mode: true