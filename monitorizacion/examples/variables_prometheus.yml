prometheus_install_dir: /opt/prometheus_server
prometheus_project_name: prometheus

monitorizacion_network: monitorizacion

prometheus_image: prom/prometheus:v3.15.0
node_exporter_image: prom/node-exporter:v1.12.1

prometheus_port: 9090
node_exporter_port: 9100

prometheus_retention: 15d
prometheus_scrape_interval: 15s
prometheus_local_name: Servidor-Principal

# Sin equipos remotos:
prometheus_departamentos: []