# Copiar y adaptar en las variables del grupo grafana_servers de AWX.

# var_grafana_install_dir: /ruta/absoluta/grafana
# var_grafana_project_name: grafana
# var_grafana_image: grafana/grafana:13.2.3

# var_grafana_port: 3000
# var_grafana_admin_user: administrador
# var_grafana_admin_email: administrador@example.com

# var_monitorizacion_network: monitorizacion
# var_grafana_prometheus_url: http://prometheus:9090

# La contraseña se proporciona mediante la credencial de AWX.
# VAR_GRAFANA_ADMIN_PASSWORD
# GUARDAS JOB 05 (v1)
# Por defecto: install => solo instalacion limpia; falla si ya hay Compose o grafana.db.
# Para revisar la instalacion actual sin modificarla:
# var_grafana_job05_mode: inspect
# En una VM nueva, con los prechecks superados:
# var_grafana_job05_mode: install
# Para generar un Compose con SMTP en una VM nueva (requiere .env privado previo):
# var_grafana_smtp_enabled: true
# Nunca introducir GRAFANA_SMTP_PASSWORD en este YAML o en Git.
