---
# Copiar y adaptar en las variables del grupo grafana-servers de AWX.

# var_grafana_install_dir: /ruta/absoluta/grafana
# var_grafana_project_name: grafana
# var_grafana_image: grafana/grafana:13.2.3

# var_grafana_port: 3000
# var_grafana_admin_user: administrador
# var_grafana_admin_email: administrador@example.com

# var_monitorizacion_network: monitorizacion
# var_grafana_prometheus_url: http://prometheus:9090

# La contraseña se proporciona mediante la credencial de AWX.
# VAR_GRAFANA_ADMIN_PASSWORD
# GUARDAS JOB 05 (v2): ausencia de variable => inspect, nunca install.
# En el laboratorio existente, configurar en Extra Variables del Job:
# var_grafana_job05_mode: inspect
#
# Solo para VM nueva, tras revisar ruta, inventario y permisos:
# var_grafana_job05_mode: install
# var_grafana_job05_confirm: INSTALL_NEW_GRAFANA
# var_grafana_smtp_enabled: false
#
# Con SMTP true, la ruta puede preexistir SOLO con un .env root:root 0600;
# sin SMTP, debe estar vacia o no existir. Nunca usar estas variables
# de instalacion en el Grafana que ya funciona.
# VAR_GRAFANA_ADMIN_PASSWORD procede de credencial AWX; no guardar secretos.
