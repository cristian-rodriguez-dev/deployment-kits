---
- name: 02 | Wazuh single-node
  hosts: wazuh-servers
  gather_facts: true
  become: true
  serial: 1
  vars:
    var_wazuh_stack_dir: '{{ var_wazuh_install_dir }}/single-node'
    var_wazuh_state_file: '{{ var_wazuh_install_dir }}/.awx-initialized'
    var_wazuh_admin_password: '{{ lookup(''ansible.builtin.env'', ''VAR_WAZUH_ADMIN_PASSWORD'') }}'
    var_wazuh_api_password: '{{ lookup(''ansible.builtin.env'', ''VAR_WAZUH_API_PASSWORD'') }}'
    var_wazuh_credentials_fingerprint: '{{ [var_wazuh_admin_password, var_wazuh_api_password] | to_json | hash(''sha256'') }}'
  tasks:
  - name: Instalar git
    ansible.builtin.apt:
      name: git
      state: present
      update_cache: true
      cache_valid_time: 3600
  - name: Preparar grupo de acceso
    ansible.builtin.group:
      name: '{{ var_wazuh_access_group }}'
      state: present
  - name: Configurar vm.max_map_count para el Indexer
    ansible.posix.sysctl:
      name: vm.max_map_count
      value: '262144'
      state: present
      sysctl_set: true
      reload: true
      sysctl_file: /etc/sysctl.d/99-wazuh.conf
  - name: Crear el directorio y permitir el acceso a tu grupo
    ansible.builtin.file:
      path: '{{ var_wazuh_install_dir }}'
      state: directory
      owner: root
      group: '{{ var_wazuh_access_group }}'
      mode: '0750'
  - name: Descargar el repositorio oficial de Wazuh
    ansible.builtin.git:
      repo: https://github.com/wazuh/wazuh-docker.git
      dest: '{{ var_wazuh_install_dir }}'
      version: v{{ var_wazuh_version }}
      depth: 1
      update: false
      force: false
  - name: Permitir el acceso al directorio single-node
    ansible.builtin.file:
      path: '{{ var_wazuh_stack_dir }}'
      state: directory
      owner: root
      group: '{{ var_wazuh_access_group }}'
      mode: '0750'
  - name: Consultar si Wazuh ya se inicializó
    ansible.builtin.stat:
      path: '{{ var_wazuh_state_file }}'
    register: var_wazuh_state
  - name: Reproducir perfil original SCA, FIM y vulnerabilidades antes del primer arranque
    ansible.builtin.script: ../tools/wazuh_manager_profile.py --apply {{ var_wazuh_stack_dir }}/config/wazuh_cluster/wazuh_manager.conf
    register: var_wazuh_profile_apply
    changed_when: "'CHANGED' in var_wazuh_profile_apply.stdout"
    when: not var_wazuh_state.stat.exists
  - name: Validar perfil original del manager sin modificarlo en reintentos
    ansible.builtin.script: ../tools/wazuh_manager_profile.py --check {{ var_wazuh_stack_dir }}/config/wazuh_cluster/wazuh_manager.conf
    changed_when: false
  - name: Comprobar credenciales iniciales
    ansible.builtin.assert:
      that:
      - var_wazuh_admin_password | length >= 8
      - var_wazuh_api_password | length >= 8
      fail_msg: Faltan las credenciales VAR_WAZUH_ADMIN_PASSWORD y VAR_WAZUH_API_PASSWORD
    when: not var_wazuh_state.stat.exists
    no_log: true
  - name: Leer el archivo Docker Compose
    ansible.builtin.slurp:
      src: '{{ var_wazuh_stack_dir }}/docker-compose.yml'
    register: var_wazuh_compose_raw
    no_log: true
  - name: Interpretar la configuración de Docker Compose
    ansible.builtin.set_fact:
      var_wazuh_compose: '{{ var_wazuh_compose_raw.content | b64decode | from_yaml }}'
    no_log: true
  - name: Limitar interfaces web y API al host
    ansible.builtin.copy:
      dest: '{{ var_wazuh_stack_dir }}/docker-compose.yml'
      owner: root
      group: root
      mode: '0600'
      content: "{{ var_wazuh_compose | combine({'services': {'wazuh.dashboard': {'ports': [(var_observability_access_ip | default('127.0.0.1')) ~ ':' ~ (var_wazuh_dashboard_port | string) ~ ':5601']}, 'wazuh.indexer': {'ports': ['127.0.0.1:9200:9200']} }}, recursive=true) | to_nice_yaml(indent=2, width=4096) }}"
    no_log: true
    diff: false
    when: not var_wazuh_state.stat.exists
  - name: Crear el archivo de credenciales de Compose
    ansible.builtin.template:
      src: ../templates/wazuh/compose.credentials.yml.j2
      dest: '{{ var_wazuh_stack_dir }}/compose.credentials.yml'
      owner: root
      group: root
      mode: '0600'
    no_log: true
    diff: false
    when: not var_wazuh_state.stat.exists
  - name: Preparar las credenciales antes del primer arranque
    when: not var_wazuh_state.stat.exists
    block:
    - name: Generar el hash de ADMIN en un contenedor temporal
      ansible.builtin.command:
        argv:
        - docker
        - run
        - --rm
        - --entrypoint
        - bash
        - -e
        - JAVA_HOME=/usr/share/wazuh-indexer/jdk
        - wazuh/wazuh-indexer:{{ var_wazuh_version }}
        - /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh
        - -p
        - '{{ var_wazuh_admin_password }}'
      register: var_wazuh_hash_result
      changed_when: true
      no_log: true
    - name: Obtener el hash generado
      ansible.builtin.set_fact:
        var_wazuh_admin_hash: '{{ var_wazuh_hash_result.stdout_lines | last | trim }}'
      no_log: true
    - name: Validar el formato del hash
      ansible.builtin.assert:
        that:
        - var_wazuh_admin_hash is match('^[$]2[aby][$][0-9]{2}[$][./A-Za-z0-9]{53}$')
      no_log: true
    - name: Aplicar el hash únicamente a ADMIN
      ansible.builtin.replace:
        path: '{{ var_wazuh_stack_dir }}/config/wazuh_indexer/internal_users.yml'
        regexp: (?m)(^admin:\s*\n[ \t]+hash:)[^\n]*
        replace: \g<1> "{{ var_wazuh_admin_hash }}"
      no_log: true
      diff: false
    - name: Leer los usuarios para verificar el cambio
      ansible.builtin.slurp:
        src: '{{ var_wazuh_stack_dir }}/config/wazuh_indexer/internal_users.yml'
      register: var_wazuh_users_check
      no_log: true
    - name: Confirmar que ADMIN tiene el hash correcto
      ansible.builtin.assert:
        that:
        - (var_wazuh_users_check.content | b64decode | from_yaml) ['admin']['hash'] == var_wazuh_admin_hash
      no_log: true
    - name: Configurar la conexión del Dashboard con la API
      ansible.builtin.copy:
        dest: '{{ var_wazuh_stack_dir }}/config/wazuh_dashboard/wazuh.yml'
        owner: root
        group: root
        mode: '0644'
        content: "hosts:\n  - default:\n      url: \"https://wazuh.manager\"\n      port: 55000\n      username: wazuh-wui\n\
          \      password: {{ var_wazuh_api_password | to_json }}\n      run_as: true\n"
      no_log: true
      diff: false
  - name: Generar los certificados iniciales
    ansible.builtin.command:
      argv:
      - docker
      - compose
      - -p
      - '{{ var_wazuh_project_name }}'
      - -f
      - generate-indexer-certs.yml
      - run
      - --rm
      - generator
      chdir: '{{ var_wazuh_stack_dir }}'
      creates: '{{ var_wazuh_install_dir }}/.awx-certificates-ready'
  - name: Registrar que el generador de certificados terminó correctamente
    ansible.builtin.copy:
      dest: '{{ var_wazuh_install_dir }}/.awx-certificates-ready'
      content: 'Certificados generados

        '
      owner: root
      group: root
      mode: '0600'
  - name: Validar la configuración de Compose
    ansible.builtin.command:
      argv:
      - docker
      - compose
      - -p
      - '{{ var_wazuh_project_name }}'
      - -f
      - docker-compose.yml
      - -f
      - compose.credentials.yml
      - config
      - --quiet
      chdir: '{{ var_wazuh_stack_dir }}'
    changed_when: false
    no_log: true
  - name: Registrar la preparación antes de crear los volúmenes
    ansible.builtin.copy:
      dest: '{{ var_wazuh_state_file }}'
      content: '{{ var_wazuh_credentials_fingerprint }}

        '
      owner: root
      group: root
      mode: '0600'
    no_log: true
    diff: false
    when: not var_wazuh_state.stat.exists
  - name: Detectar overlay de integración del bot
    ansible.builtin.stat:
      path: "{{ var_wazuh_stack_dir }}/compose.triage.yml"
    register: triage_wazuh_compose_stat
  - name: Detectar overlay del puente Traefik
    ansible.builtin.stat:
      path: "{{ var_wazuh_stack_dir }}/compose.traefik.yml"
    register: traefik_wazuh_compose_stat
  - name: Arrancar los servicios de Wazuh
    community.docker.docker_compose_v2:
      project_src: '{{ var_wazuh_stack_dir }}'
      project_name: '{{ var_wazuh_project_name }}'
      files: "{{ ['docker-compose.yml', 'compose.credentials.yml'] + (['compose.triage.yml'] if triage_wazuh_compose_stat.stat.exists else []) + (['compose.traefik.yml'] if traefik_wazuh_compose_stat.stat.exists else []) }}"
      state: present
      pull: missing
      recreate: auto
    no_log: true
  - name: Esperar a que el Dashboard responda
    ansible.builtin.uri:
      url: "https://{{ var_observability_access_ip }}:{{ var_wazuh_dashboard_port }}/"
      validate_certs: false
      follow_redirects: none
      status_code:
      - 200
      - 302
    register: var_wazuh_dashboard_check
    until: (var_wazuh_dashboard_check.status | default(0)) in [200, 302]
    retries: 60
    delay: 10
