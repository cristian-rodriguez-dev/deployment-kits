---
- name: 14 | Desplegar Security Triage original y conectar Wazuh
  hosts: wazuh-servers
  become: true
  gather_facts: false
  vars:
    triage_webhook_token: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_WEBHOOK_TOKEN') }}"
    triage_metrics_token: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_METRICS_TOKEN') }}"
    triage_indexer_password: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_INDEXER_PASSWORD') }}"
    triage_gemini_key: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_GEMINI_API_KEY') }}"
    triage_smtp_password: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_SMTP_PASSWORD') }}"
    triage_telegram_token: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_TELEGRAM_BOT_TOKEN') }}"
    triage_telegram_chat_id: "{{ lookup('ansible.builtin.env', 'VAR_TRIAGE_TELEGRAM_CHAT_ID') }}"
    triage_wazuh_admin_password: "{{ lookup('ansible.builtin.env', 'VAR_WAZUH_ADMIN_PASSWORD') }}"
    triage_stack: "{{ var_wazuh_install_dir }}/single-node"
    triage_indexer_base: https://127.0.0.1:9200
    triage_compose_files:
      - compose.yml
      - compose.indexer.yml
      - compose.mail.yml
      - compose.telegram.yml
      - compose.metrics.yml
      - compose.runtime.yml
  tasks:
    - name: Validar identidad y secretos requeridos
      ansible.builtin.assert:
        that:
          - var_triage_bot_install_dir is match('^/[^\n]+$')
          - var_triage_bot_install_dir != '/'
          - triage_webhook_token | length >= 32
          - triage_metrics_token | length >= 32
          - triage_indexer_password | length >= 12
          - triage_wazuh_admin_password | length >= 8
          - triage_webhook_token != triage_metrics_token
          - not (var_triage_mail_enabled | default(false) | bool) or (triage_smtp_password | length > 0 and var_triage_mail_from | default('') | length > 0 and var_triage_mail_to | default('') | length > 0)
          - not (var_triage_telegram_enabled | default(false) | bool) or (triage_telegram_token | length > 0 and triage_telegram_chat_id | length > 0)
          - not (var_triage_ai_enabled | default(false) | bool) or triage_gemini_key | length > 0
        fail_msg: Faltan secretos de la credencial AWX Triage o variables no secretas del inventario
      no_log: true

    - name: Consultar los permisos actuales del rol Indexer
      ansible.builtin.uri:
        url: "{{ triage_indexer_base }}/_plugins/_security/api/roles/security_triage_reader"
        url_username: admin
        url_password: "{{ triage_wazuh_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: triage_role_result
      no_log: true
      changed_when: false

    - name: Crear rol Indexer limitado a lectura de alertas y monitoring
      ansible.builtin.uri:
        url: "{{ triage_indexer_base }}/_plugins/_security/api/roles/security_triage_reader"
        method: PUT
        url_username: admin
        url_password: "{{ triage_wazuh_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        status_code: [200, 201]
        body:
          cluster_permissions: [cluster_composite_ops_ro]
          index_permissions:
            - index_patterns: ['wazuh-alerts-*', 'wazuh-monitoring-*']
              allowed_actions: [read]
          tenant_permissions: []
      when: triage_role_result.status == 404
      no_log: true

    - name: Consultar usuario Indexer del bot
      ansible.builtin.uri:
        url: "{{ triage_indexer_base }}/_plugins/_security/api/internalusers/security_triage_indexer_ro"
        url_username: admin
        url_password: "{{ triage_wazuh_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 404]
      register: triage_user_result
      changed_when: false
      no_log: true

    - name: Crear usuario Indexer sin permiso de escritura
      ansible.builtin.uri:
        url: "{{ triage_indexer_base }}/_plugins/_security/api/internalusers/security_triage_indexer_ro"
        method: PUT
        url_username: admin
        url_password: "{{ triage_wazuh_admin_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200, 201]
        body_format: json
        body:
          password: "{{ triage_indexer_password }}"
          opendistro_security_roles: [security_triage_reader]
          backend_roles: []
          attributes: {}
      when: triage_user_result.status == 404
      no_log: true

    - name: Validar autenticación del usuario de lectura sin consultar alertas
      ansible.builtin.uri:
        url: "{{ triage_indexer_base }}/_plugins/_security/authinfo"
        url_username: security_triage_indexer_ro
        url_password: "{{ triage_indexer_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
        return_content: true
      register: triage_ro_auth
      changed_when: false
      no_log: true

    - name: Confirmar rol limitado del usuario
      ansible.builtin.assert:
        that:
          - "'security_triage_reader' in (triage_ro_auth.json.roles | default([]))"
      no_log: true

    - name: Consultar red Docker del bot
      ansible.builtin.command:
        argv: [docker, network, inspect, triage-webhooks]
      register: triage_webhook_network
      failed_when: false
      changed_when: false

    - name: Rechazar red de webhooks sin aislamiento
      ansible.builtin.assert:
        that:
          - (triage_webhook_network.stdout | from_json)[0].Driver == 'bridge'
          - (triage_webhook_network.stdout | from_json)[0].Internal | bool
      when: triage_webhook_network.rc == 0

    - name: Crear red privada de webhooks
      ansible.builtin.command:
        argv: [docker, network, create, --driver, bridge, --internal, triage-webhooks]
      when: triage_webhook_network.rc != 0

    - name: Consultar red privada de métricas
      ansible.builtin.command:
        argv: [docker, network, inspect, triage-metrics-private]
      register: triage_metrics_network
      failed_when: false
      changed_when: false

    - name: Rechazar red de métricas sin aislamiento
      ansible.builtin.assert:
        that:
          - (triage_metrics_network.stdout | from_json)[0].Driver == 'bridge'
          - (triage_metrics_network.stdout | from_json)[0].Internal | bool
      when: triage_metrics_network.rc == 0

    - name: Crear red interna de métricas
      ansible.builtin.command:
        argv: [docker, network, create, --driver, bridge, --internal, triage-metrics-private]
      when: triage_metrics_network.rc != 0

    - name: Localizar Loki dentro de K3s
      ansible.builtin.command:
        argv: [k3s, kubectl, -n, logging, get, service, loki-gateway, -o, 'jsonpath={.spec.clusterIP}']
      register: triage_loki_ip
      changed_when: false
      failed_when: triage_loki_ip.rc != 0 or triage_loki_ip.stdout | length == 0

    - name: Crear directorios privados del Triage Bot
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ var_triage_bot_install_dir }}", mode: '0750'}
        - {path: "{{ var_triage_bot_install_dir }}/.local-secrets", mode: '0700'}
        - {path: "{{ var_triage_bot_install_dir }}/app", mode: '0755'}
        - {path: "{{ var_triage_bot_install_dir }}/wazuh", mode: '0755'}

    - name: Copiar código del bot original
      ansible.builtin.copy:
        src: ../triage-bot/app/
        dest: "{{ var_triage_bot_install_dir }}/app/"
        mode: preserve
      register: triage_app_copy

    - name: Copiar manifiestos originales del bot
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../triage-bot/{{ item }}"
        dest: "{{ var_triage_bot_install_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - Dockerfile
        - requirements.txt
        - .dockerignore
        - compose.yml
        - compose.indexer.yml
        - compose.mail.yml
        - compose.telegram.yml
        - compose.metrics.yml
      register: triage_source_copy

    - name: Copiar integrador original de Wazuh
      ansible.builtin.copy:
        src: ../triage-bot/wazuh/custom-security-triage
        dest: "{{ var_triage_bot_install_dir }}/wazuh/custom-security-triage"
        owner: root
        group: root
        mode: '0755'
      register: triage_integrator_copy

    - name: Copiar CA del Indexer con lectura permitida
      ansible.builtin.copy:
        src: "{{ triage_stack }}/config/wazuh_indexer_ssl_certs/root-ca.pem"
        dest: "{{ var_triage_bot_install_dir }}/.local-secrets/indexer_ca.pem"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Escribir contraseña privada del Indexer
      ansible.builtin.copy:
        content: "{{ triage_indexer_password }}"
        dest: "{{ var_triage_bot_install_dir }}/.local-secrets/indexer_password"
        owner: '10001'
        group: '10001'
        mode: '0400'
      no_log: true
      diff: false

    - name: Determinar GID del grupo Wazuh en el Manager
      ansible.builtin.command:
        argv: [docker, compose, -p, "{{ var_wazuh_project_name }}", -f, docker-compose.yml, -f, compose.credentials.yml, exec, -T, wazuh.manager, id, -g, wazuh]
        chdir: "{{ triage_stack }}"
      register: triage_manager_gid
      changed_when: false

    - name: Ajustar permisos del integrador para Wazuh
      ansible.builtin.file:
        path: "{{ var_triage_bot_install_dir }}/wazuh/custom-security-triage"
        owner: root
        group: "{{ triage_manager_gid.stdout | trim }}"
        mode: '0750'

    - name: Escribir token del integrador con permisos limitados
      ansible.builtin.copy:
        content: "{{ triage_webhook_token }}"
        dest: "{{ var_triage_bot_install_dir }}/.local-secrets/triage_webhook_token"
        owner: root
        group: "{{ triage_manager_gid.stdout | trim }}"
        mode: '0640'
      no_log: true
      diff: false

    - name: Generar archivos de entorno protegidos para los tres servicios
      ansible.builtin.template:
        src: "../templates/integration/{{ item.src }}"
        dest: "{{ var_triage_bot_install_dir }}/{{ item.dst }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - {src: triage-env-main.j2, dst: .env}
        - {src: triage-env-mail.j2, dst: .env.mail}
        - {src: triage-env-telegram.j2, dst: .env.telegram}
      no_log: true
      diff: false

    - name: Crear overlay de redes locales del bot
      ansible.builtin.template:
        src: ../templates/integration/triage-runtime.yml.j2
        dest: "{{ var_triage_bot_install_dir }}/compose.runtime.yml"
        owner: root
        group: root
        mode: '0644'

    - name: Validar compose completo antes de desplegar
      ansible.builtin.command:
        argv: [docker, compose, -p, security-triage, -f, compose.yml, -f, compose.indexer.yml, -f, compose.mail.yml, -f, compose.telegram.yml, -f, compose.metrics.yml, -f, compose.runtime.yml, config, -q]
        chdir: "{{ var_triage_bot_install_dir }}"
      changed_when: false
      no_log: true

    - name: Desplegar bot y notificadores con persistencia SQLite
      community.docker.docker_compose_v2:
        project_src: "{{ var_triage_bot_install_dir }}"
        project_name: security-triage
        files: "{{ triage_compose_files }}"
        state: present
        pull: missing
        build: "{{ 'always' if (triage_app_copy.changed or triage_source_copy.changed) else 'policy' }}"
        recreate: auto
      no_log: true

    - name: Leer redes originales del Wazuh Manager
      ansible.builtin.slurp:
        src: "{{ triage_stack }}/docker-compose.yml"
      register: triage_wazuh_compose_raw
      no_log: true

    - name: Conservar la red original y añadir webhooks
      ansible.builtin.set_fact:
        triage_wazuh_manager_networks: "{{ ((triage_wazuh_compose_raw.content | b64decode | from_yaml).services['wazuh.manager'].networks | default(['default']) | list | difference(['triage-webhooks'])) + ['triage-webhooks'] }}"

    - name: Preparar overlay persistente de Wazuh
      ansible.builtin.template:
        src: ../templates/integration/triage-wazuh-overlay.yml.j2
        dest: "{{ triage_stack }}/compose.triage.yml"
        owner: root
        group: root
        mode: '0644'
      register: triage_wazuh_overlay

    - name: Incorporar integración real de alertas al Manager
      ansible.builtin.blockinfile:
        path: "{{ triage_stack }}/config/wazuh_cluster/wazuh_manager.conf"
        insertbefore: '</ossec_config>'
        marker: '<!-- {mark} deployment-kits-triage -->'
        block: "{{ lookup('ansible.builtin.file', '../templates/integration/wazuh-triage-integration.xml') }}"
        backup: true
      register: triage_manager_config

    - name: Comprobar overlay existente de Traefik
      ansible.builtin.stat:
        path: "{{ triage_stack }}/compose.traefik.yml"
      register: triage_traefik_overlay

    - name: Recrear únicamente el Wazuh Manager si cambia el integrador
      community.docker.docker_compose_v2:
        project_src: "{{ triage_stack }}"
        project_name: "{{ var_wazuh_project_name }}"
        files: "{{ ['docker-compose.yml', 'compose.credentials.yml', 'compose.triage.yml'] + (['compose.traefik.yml'] if triage_traefik_overlay.stat.exists else []) }}"
        services: [wazuh.manager]
        state: present
        pull: missing
        recreate: "{{ 'always' if (triage_manager_config.changed or triage_wazuh_overlay.changed or triage_integrator_copy.changed) else 'auto' }}"
      no_log: true

    - name: Confirmar salud HTTP del bot
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/health
        status_code: 200
        return_content: true
      register: triage_health
      until: triage_health.status | default(0) == 200
      retries: 15
      delay: 4
      changed_when: false

    - name: Confirmar endpoint de métricas autenticado
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/internal/metrics
        headers:
          Authorization: "Bearer {{ triage_metrics_token }}"
        status_code: 200
      changed_when: false
      no_log: true
