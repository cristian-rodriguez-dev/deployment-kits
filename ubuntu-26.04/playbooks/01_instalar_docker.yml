- name: 01 | Docker oficial
  hosts: docker_servers
  gather_facts: true
  become: true
  tasks:
  - name: Instalar dependencias APT
    ansible.builtin.apt:
      name:
      - ca-certificates
      - curl
      - python3-apt
      state: present
      update_cache: true
      cache_valid_time: 3600
  - name: Crear directorio para la clave Docker
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'
  - name: Descargar clave oficial de Docker
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'
  - name: Añadir repositorio oficial Docker
    ansible.builtin.apt_repository:
      repo: 'deb [arch={{ {''x86_64'': ''amd64'', ''aarch64'': ''arm64''}[ansible_facts.architecture] }} signed-by=/etc/apt/keyrings/docker.asc]
        https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable'
      filename: docker
      state: present
      update_cache: true
  - name: Instalar Docker Engine y Compose
    ansible.builtin.apt:
      name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      state: present
  - name: Activar Docker
    ansible.builtin.systemd_service:
      name: docker
      enabled: true
      state: started

  - name: Comprobar red Docker común
    ansible.builtin.command:
      argv: [docker, network, inspect, "{{ var_monitorizacion_network }}"]
    register: dk_network
    changed_when: false
    failed_when: false
  - name: Crear red Docker para integraciones
    ansible.builtin.command:
      argv: [docker, network, create, "{{ var_monitorizacion_network }}"]
    when: dk_network.rc != 0
