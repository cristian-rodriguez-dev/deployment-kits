# Overlay de Compose: usar SIEMPRE junto al compose.yml original del bot.
# Compartimos su volumen triage-data, sin alterar el contenedor FastAPI.
services:
  mail-notifier:
    build: .
    command: ["python", "-u", "-m", "app.mail_notifier"]
    container_name: security-triage-mail
    restart: unless-stopped
    env_file: .env.mail
    volumes:
      - triage-data:/data
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
