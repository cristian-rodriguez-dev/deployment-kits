apiVersion: v1
kind: ServiceAccount
metadata:
  name: dk-observability-reader
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: dk-observability-reader-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: dk-observability-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dk-ksm-proxy
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["kube-state-metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dk-ksm-proxy
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: dk-observability-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dk-ksm-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dk-loki-proxy
  namespace: logging
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["loki-gateway"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dk-loki-proxy
  namespace: logging
subjects:
  - kind: ServiceAccount
    name: dk-observability-reader
    namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dk-loki-proxy
