apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    logs:
      access:
        enabled: true
        format: json
        fields:
          general:
            defaultmode: keep
          headers:
            defaultmode: drop
    metrics:
      prometheus:
        service:
          enabled: true
    additionalArguments:
      - "--accesslog.fields.queryparameters.defaultmode=drop"
